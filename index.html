    <script>
      (function() {
        try {
          var t = sessionStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script>
      // Suppress benign Vite HMR websocket connection warnings/errors in sandboxed preview environment
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function (url, protocols) {
            const urlStr = typeof url === 'string' ? url : '';
            const protStr = typeof protocols === 'string' ? protocols : Array.isArray(protocols) ? protocols.join(' ') : '';
            const isViteHmr =
              urlStr.includes('vite') ||
              urlStr.includes('ws') ||
              protStr.includes('vite-hmr');

            if (isViteHmr) {
              const dummyWs = {
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                url: urlStr,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; },
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
              };
              return dummyWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          if (NativeWebSocket.prototype) {
            window.WebSocket.prototype = NativeWebSocket.prototype;
          }
        }

        const isViteWsError = (msg) =>
          typeof msg === 'string' &&
          (msg.includes('[vite]') ||
            msg.includes('WebSocket closed') ||
            msg.includes('vite:ws') ||
            msg.includes('failed to connect'));

        const origError = console.error;
        console.error = function (...args) {
          if (args.some((a) => isViteWsError(a) || (a && isViteWsError(a.message)))) return;
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function (...args) {
          if (args.some((a) => isViteWsError(a) || (a && isViteWsError(a.message)))) return;
          origWarn.apply(console, args);
        };

        const origLog = console.log;
        console.log = function (...args) {
          if (args.some((a) => isViteWsError(a) || (a && isViteWsError(a.message)))) return;
          origLog.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (event) {
          if (event.reason && isViteWsError(event.reason.message || event.reason)) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function (event) {
          if (event && isViteWsError(event.message || event.filename)) {
            event.preventDefault();
          }
        });
      })();
    </script>
